<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc" data-snapshot-intensity="medium">
  <title id="title">Token Usage — daily activity</title>
  <desc id="desc">A privacy-safe static snapshot of thirty daily relative usage buckets from July 25 through August 23, 2026. Clean day cells use cool, medium, and hot colors to represent relative daily token activity. One continuous pixel-fire frame around the whole panel represents the snapshot's overall medium activity. The fire is playful artwork, not a temperature or live meter.</desc>

  <defs>
    <filter id="frame-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="fire-horizontal" width="32" height="22" patternUnits="userSpaceOnUse">
      <rect x="0" y="12" width="32" height="10" fill="#b52a25"/>
      <rect x="2" y="8" width="10" height="6" fill="#ef5b22">
        <animate attributeName="height" values="5;8;5" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="9;6;9" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="12" y="2" width="8" height="12" fill="#ff9b2f">
        <animate attributeName="height" values="9;14;9" dur="1.7s" begin="-0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="5;0;5" dur="1.7s" begin="-0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="20" y="7" width="9" height="7" fill="#ffd34d">
        <animate attributeName="opacity" values="0.58;1;0.58" dur="1.05s" begin="-0.2s" repeatCount="indefinite"/>
      </rect>
    </pattern>

    <pattern id="fire-vertical" width="22" height="32" patternUnits="userSpaceOnUse">
      <rect x="12" y="0" width="10" height="32" fill="#b52a25"/>
      <rect x="8" y="2" width="6" height="10" fill="#ef5b22">
        <animate attributeName="width" values="5;8;5" dur="1.55s" repeatCount="indefinite"/>
        <animate attributeName="x" values="9;6;9" dur="1.55s" repeatCount="indefinite"/>
      </rect>
      <rect x="2" y="12" width="12" height="8" fill="#ff9b2f">
        <animate attributeName="width" values="9;14;9" dur="1.85s" begin="-0.7s" repeatCount="indefinite"/>
        <animate attributeName="x" values="5;0;5" dur="1.85s" begin="-0.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="7" y="21" width="7" height="8" fill="#ffd34d">
        <animate attributeName="opacity" values="0.58;1;0.58" dur="1.15s" begin="-0.35s" repeatCount="indefinite"/>
      </rect>
    </pattern>

    <g id="day-zero" shape-rendering="crispEdges">
      <rect width="34" height="34" rx="3" fill="#151b26" stroke="#2b3548" stroke-width="2"/>
    </g>
    <g id="day-low" shape-rendering="crispEdges">
      <rect width="34" height="34" rx="3" fill="#123249" stroke="#2d6681" stroke-width="2"/>
      <rect x="7" y="24" width="20" height="3" fill="#54d7f2" opacity="0.34"/>
    </g>
    <g id="day-medium" shape-rendering="crispEdges">
      <rect width="34" height="34" rx="3" fill="#8b3d17" stroke="#ff8a2d" stroke-width="2"/>
      <rect x="7" y="7" width="20" height="20" fill="#d45d1e" opacity="0.72"/>
    </g>
    <g id="day-high" shape-rendering="crispEdges">
      <rect width="34" height="34" rx="3" fill="#a91636" stroke="#ff4d66" stroke-width="2"/>
      <rect x="6" y="6" width="22" height="22" fill="#f04432" opacity="0.82"/>
      <rect x="13" y="13" width="8" height="8" fill="#ffd34d"/>
    </g>
  </defs>

  <!-- A single medium-intensity fire frame surrounds the complete panel. -->
  <rect x="18" y="18" width="684" height="414" rx="18" fill="none" stroke="#ef5b22" stroke-width="10" opacity="0.62" filter="url(#frame-glow)">
    <animate attributeName="opacity" values="0.48;0.76;0.48" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <g shape-rendering="crispEdges" aria-label="Continuous pixel-fire border showing medium overall activity">
    <rect x="16" y="0" width="688" height="22" fill="url(#fire-horizontal)"/>
    <rect x="16" y="428" width="688" height="22" fill="url(#fire-horizontal)" transform="rotate(180 360 439)"/>
    <rect x="0" y="16" width="22" height="418" fill="url(#fire-vertical)"/>
    <rect x="698" y="16" width="22" height="418" fill="url(#fire-vertical)" transform="rotate(180 709 225)"/>
    <rect x="0" y="0" width="22" height="22" fill="#ff9b2f"/>
    <rect x="698" y="0" width="22" height="22" fill="#ff9b2f"/>
    <rect x="0" y="428" width="22" height="22" fill="#ef5b22"/>
    <rect x="698" y="428" width="22" height="22" fill="#ef5b22"/>
  </g>

  <rect x="26" y="26" width="668" height="398" rx="14" fill="#0b1019" stroke="#36435b" stroke-width="2"/>

  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">
    <text x="48" y="62" fill="#f2f5f9" font-size="28" font-weight="700" letter-spacing="1.4">TOKEN USAGE</text>
    <text x="48" y="84" fill="#93a4bc" font-size="16" letter-spacing="0.8">DAILY ACTIVITY</text>
    <text x="672" y="62" fill="#d5ddea" font-size="16" text-anchor="end">UPDATED AUG 23, 2026</text>
    <text x="672" y="83" fill="#74849c" font-size="15" text-anchor="end">STATIC SNAPSHOT · NOT LIVE</text>

    <text x="210" y="133" fill="#74849c" font-size="15" text-anchor="end">SUN</text>
    <text x="210" y="253" fill="#74849c" font-size="15" text-anchor="end">WED</text>
    <text x="210" y="373" fill="#74849c" font-size="15" text-anchor="end">SAT</text>
    <text x="230" y="103" fill="#93a4bc" font-size="15">JUL</text>
    <text x="270" y="103" fill="#93a4bc" font-size="15">AUG</text>
  </g>

  <!-- The thirty cells contain relative buckets only; no token totals or model data. -->
  <g aria-label="Thirty-day relative daily token-activity heatmap">
    <g transform="translate(230 350)" role="img" aria-label="July 25, 2026: medium relative usage"><title>July 25, 2026 — medium relative usage</title><use href="#day-medium"/></g>
    <g transform="translate(270 110)" role="img" aria-label="July 26, 2026: high relative usage"><title>July 26, 2026 — high relative usage</title><use href="#day-high"/></g>
    <g transform="translate(270 150)" role="img" aria-label="July 27, 2026: medium relative usage"><title>July 27, 2026 — medium relative usage</title><use href="#day-medium"/></g>
    <g transform="translate(270 190)" role="img" aria-label="July 28, 2026: medium relative usage"><title>July 28, 2026 — medium relative usage</title><use href="#day-medium"/></g>
    <g transform="translate(270 230)" role="img" aria-label="July 29, 2026: low relative usage"><title>July 29, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(270 270)" role="img" aria-label="July 30, 2026: medium relative usage"><title>July 30, 2026 — medium relative usage</title><use href="#day-medium"/></g>
    <g transform="translate(270 310)" role="img" aria-label="July 31, 2026: medium relative usage"><title>July 31, 2026 — medium relative usage</title><use href="#day-medium"/></g>
    <g transform="translate(270 350)" role="img" aria-label="August 1, 2026: high relative usage"><title>August 1, 2026 — high relative usage</title><use href="#day-high"/></g>
    <g transform="translate(310 110)" role="img" aria-label="August 2, 2026: high relative usage"><title>August 2, 2026 — high relative usage</title><use href="#day-high"/></g>
    <g transform="translate(310 150)" role="img" aria-label="August 3, 2026: medium relative usage"><title>August 3, 2026 — medium relative usage</title><use href="#day-medium"/></g>
    <g transform="translate(310 190)" role="img" aria-label="August 4, 2026: medium relative usage"><title>August 4, 2026 — medium relative usage</title><use href="#day-medium"/></g>
    <g transform="translate(310 230)" role="img" aria-label="August 5, 2026: high relative usage"><title>August 5, 2026 — high relative usage</title><use href="#day-high"/></g>
    <g transform="translate(310 270)" role="img" aria-label="August 6, 2026: medium relative usage"><title>August 6, 2026 — medium relative usage</title><use href="#day-medium"/></g>
    <g transform="translate(310 310)" role="img" aria-label="August 7, 2026: low relative usage"><title>August 7, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(310 350)" role="img" aria-label="August 8, 2026: low relative usage"><title>August 8, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(350 110)" role="img" aria-label="August 9, 2026: low relative usage"><title>August 9, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(350 150)" role="img" aria-label="August 10, 2026: low relative usage"><title>August 10, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(350 190)" role="img" aria-label="August 11, 2026: low relative usage"><title>August 11, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(350 230)" role="img" aria-label="August 12, 2026: low relative usage"><title>August 12, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(350 270)" role="img" aria-label="August 13, 2026: low relative usage"><title>August 13, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(350 310)" role="img" aria-label="August 14, 2026: low relative usage"><title>August 14, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(350 350)" role="img" aria-label="August 15, 2026: low relative usage"><title>August 15, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(390 110)" role="img" aria-label="August 16, 2026: low relative usage"><title>August 16, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(390 150)" role="img" aria-label="August 17, 2026: medium relative usage"><title>August 17, 2026 — medium relative usage</title><use href="#day-medium"/></g>
    <g transform="translate(390 190)" role="img" aria-label="August 18, 2026: medium relative usage"><title>August 18, 2026 — medium relative usage</title><use href="#day-medium"/></g>
    <g transform="translate(390 230)" role="img" aria-label="August 19, 2026: low relative usage"><title>August 19, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(390 270)" role="img" aria-label="August 20, 2026: low relative usage"><title>August 20, 2026 — low relative usage</title><use href="#day-low"/></g>
    <g transform="translate(390 310)" role="img" aria-label="August 21, 2026: medium relative usage"><title>August 21, 2026 — medium relative usage</title><use href="#day-medium"/></g>
    <g transform="translate(390 350)" role="img" aria-label="August 22, 2026: medium relative usage"><title>August 22, 2026 — medium relative usage</title><use href="#day-medium"/></g>
    <g transform="translate(430 110)" role="img" aria-label="August 23, 2026: low relative usage"><title>August 23, 2026 — low relative usage</title><use href="#day-low"/></g>
  </g>

  <g transform="translate(500 145)" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">
    <text x="0" y="0" fill="#93a4bc" font-size="15" letter-spacing="0.7">RELATIVE ACTIVITY</text>
    <use href="#day-zero" transform="translate(0 18) scale(.58)"/>
    <text x="30" y="35" fill="#74849c" font-size="15">ZERO</text>
    <use href="#day-low" transform="translate(0 55) scale(.58)"/>
    <text x="30" y="72" fill="#54d7f2" font-size="15">LOW</text>
    <use href="#day-medium" transform="translate(0 92) scale(.58)"/>
    <text x="30" y="109" fill="#ff9b2f" font-size="15">MEDIUM</text>
    <use href="#day-high" transform="translate(0 129) scale(.58)"/>
    <text x="30" y="146" fill="#ff667a" font-size="15">HIGH</text>
    <text x="0" y="190" fill="#74849c" font-size="14">FIRE FRAME:</text>
    <text x="0" y="209" fill="#ff9b2f" font-size="14">OVERALL MEDIUM</text>
    <text x="0" y="222" fill="#65758d" font-size="13">PLAYFUL VISUAL</text>
    <text x="0" y="239" fill="#65758d" font-size="13">NOT TEMPERATURE</text>
  </g>

  <line x1="48" y1="397" x2="672" y2="397" stroke="#36435b"/>
  <text x="360" y="416" fill="#74849c" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="14" text-anchor="middle">RELATIVE BUCKETS · NO TOTALS OR ACCOUNT DETAILS</text>
</svg>
